name: labos-docs

services:
  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile.dev
    init: true
    restart: "no"
    stop_grace_period: 30s
    working_dir: /app
    volumes:
      - ./docs:/app
      - docs_node_modules:/app/node_modules
    command: npm run build

volumes:
  docs_node_modules:
